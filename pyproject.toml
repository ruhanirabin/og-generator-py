[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ogimg"
dynamic = ["version"]
description = "Deterministic, template-based social image generation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "src/ogimg/templates/fonts/OFL.txt"]
authors = [
  { name = "Ruhani Rabin" },
]
dependencies = ["Pillow>=11.0,<13"]

[project.urls]
Homepage = "https://www.ruhanirabin.com"
Repository = "https://github.com/ruhanirabin/og-generator-py"
Issues = "https://github.com/ruhanirabin/og-generator-py/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
ogimg = "ogimg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ogimg"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/VERSION",
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
